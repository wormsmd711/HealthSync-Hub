name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate release signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HealthSync Hub, OU=HealthSync Hub, O=HealthSync Hub, L=West Winfield, S=NY, C=US"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build signed release AAB
        run: gradle :app:bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: HealthSyncHub-SIGNED-AAB
          path: "**/build/outputs/bundle/release/*.aab"

      - name: Upload signing key backup SAVE THIS
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THIS-HealthSyncHub-upload-keystore
          path: app/upload-keystore.jks
